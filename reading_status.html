<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>読書状況</title>
    <script id="dev-helper">
      window.POMS_DEV = new URLSearchParams(location.search).get("dev") === "1";
      window.withDev = function (url) {
        return window.POMS_DEV ? url + (url.includes("?") ? "&" : "?") + "dev=1" : url;
      };

      if (window.POMS_DEV) {
        document.addEventListener("DOMContentLoaded", function () {
          const banner = document.createElement("div");
          banner.className = "dev-banner";
          banner.textContent = "開発者モード：テスト回答は研究データ対象外です";
          document.body.prepend(banner);
        });
      }
    </script>
  </head>
  <body>
    <main class="survey-page">
      <h1>第1段階の回答を保存しました</h1>

      <section class="survey-card">
        <h2>推薦された本の読書状況</h2>
        <p>推薦された本のうち、実際に読んだ、または一部読んだ本がありますか？</p>

        <form id="statusForm" novalidate>
          <label><input type="radio" name="status" value="read" required /> 読んだ本がある</label><br />
          <label><input type="radio" name="status" value="partial" /> 一部読んだ本がある</label><br />
          <label><input type="radio" name="status" value="past" /> 過去に読んだことがある本がある</label><br />
          <label><input type="radio" name="status" value="notyet" /> まだ読んでいない</label>

          <div class="survey-actions">
            <button class="survey-button" type="submit">次へ</button>
          </div>
        </form>
      </section>
    </main>

    <script>
      document.getElementById("statusForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;

        if (!window.POMS_DEV && !form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const status = new FormData(form).get("status") || (window.POMS_DEV ? "notyet" : null);
        localStorage.setItem("reading_status", status);

        location.href = withDev(status === "notyet" ? "thanks.html" : "reading_evaluation.html");
      });
    </script>
  </body>
</html>
