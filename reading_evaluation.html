<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>第2段階評価</title><script id="dev-helper">
window.POMS_DEV=new URLSearchParams(location.search).get('dev')==='1';
window.withDev=function(url){return window.POMS_DEV ? url+(url.includes('?')?'&':'?')+'dev=1' : url;};
if(window.POMS_DEV){document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');b.className='dev-banner';b.textContent='開発者モード：テスト回答は研究データ対象外です';document.body.prepend(b);});}
</script></head><body><main class="survey-page"><h1>第2段階：読書後評価</h1><p>実際に読んだ、または読んだ経験のある推薦本について回答してください。</p><form id="readForm" novalidate><section class="survey-card"><label>評価する本<select id="bookSelect" name="book" required><option value="" selected disabled hidden>選択してください</option></select></label><p>実際に読んでみて、現在の気分に合っていると感じましたか？</p><div class="likert"><label><input type="radio" name="actualFit" value="1" required>1 まったくそう思わない</label><label><input type="radio" name="actualFit" value="2">2 あまり当てはまらない</label><label><input type="radio" name="actualFit" value="3">3 どちらともいえない</label><label><input type="radio" name="actualFit" value="4">4 やや当てはまる</label><label><input type="radio" name="actualFit" value="5">5 とてもそう思う</label></div><p>推薦理由と実際の本の内容は合っていると感じましたか？</p><div class="likert"><label><input type="radio" name="reasonMatch" value="1" required>1 まったくそう思わない</label><label><input type="radio" name="reasonMatch" value="2">2 あまり当てはまらない</label><label><input type="radio" name="reasonMatch" value="3">3 どちらともいえない</label><label><input type="radio" name="reasonMatch" value="4">4 やや当てはまる</label><label><input type="radio" name="reasonMatch" value="5">5 とてもそう思う</label></div><p>読む前の期待と実際の内容は一致していましたか？</p><div class="likert"><label><input type="radio" name="expectation" value="1" required>1 まったくそう思わない</label><label><input type="radio" name="expectation" value="2">2 あまり当てはまらない</label><label><input type="radio" name="expectation" value="3">3 どちらともいえない</label><label><input type="radio" name="expectation" value="4">4 やや当てはまる</label><label><input type="radio" name="expectation" value="5">5 とてもそう思う</label></div><p>この本を推薦されてよかったと思いますか？</p><div class="likert"><label><input type="radio" name="satisfaction" value="1" required>1 まったくそう思わない</label><label><input type="radio" name="satisfaction" value="2">2 あまり当てはまらない</label><label><input type="radio" name="satisfaction" value="3">3 どちらともいえない</label><label><input type="radio" name="satisfaction" value="4">4 やや当てはまる</label><label><input type="radio" name="satisfaction" value="5">5 とてもそう思う</label></div></section><button type="submit" class="survey-button">第2段階の回答を保存</button></form></main><script>const books=JSON.parse(localStorage.getItem('recommended_books')||'[]'),sel=document.getElementById('bookSelect');books.forEach(b=>{const o=document.createElement('option');o.value=b.title;o.textContent=b.title;sel.appendChild(o);});document.getElementById('readForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),ans={savedAt:new Date().toISOString(),book:f.get('book'),actualFit:Number(f.get('actualFit')),reasonMatch:Number(f.get('reasonMatch')),expectation:Number(f.get('expectation')),satisfaction:Number(f.get('satisfaction'))};localStorage.setItem('stage2_evaluation',JSON.stringify(ans));location.href=withDev('thanks.html');});</script></body></html>
