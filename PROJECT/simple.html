<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>気分チェック 簡易版</title>

<link rel="stylesheet" href="style.css">

<style>

#questions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.description {
  text-align: center;
  margin-bottom: 20px;
}

.question {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;

  background: #f5f5f5;

  padding: 12px;

  border-radius: 8px;

  min-height: 110px;
}

.question span {
  text-align: center;
  margin-bottom: 10px;
}

.question select {
  width: 100%;
  padding: 8px;
}

#bottom {
  display: flex;
  justify-content: center;
  margin-top: 30px;
}

button {
  width: 250px;
  padding: 15px;
  font-size: 18px;

  background: #4CAF50;
  color: white;

  border: none;
  border-radius: 10px;

  cursor: pointer;
}

@media (max-width: 900px) {

  #questions {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 767px) {

  #questions {
    grid-template-columns: 1fr;
  }

  select {
    height: 48px;
    font-size: 16px;
  }

  button {
    width: 100%;
    min-height: 56px;
  }

}


/* 未回答項目の誘導 */
.question.unanswered {
  border: 2px solid #d32f2f;
  background: #fff1f1;
}
.question.unanswered select {
  border: 2px solid #d32f2f;
}
#errorMessage {
  display: none;
  color: #b71c1c;
  background: #ffebee;
  border: 1px solid #ef9a9a;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 12px auto;
  max-width: 720px;
  font-weight: bold;
  text-align: center;
}
</style>

</head>


<body>

<h1>気分チェック 簡易版</h1>

<p class="description">
  今日を含めて過去1週間に、
  次の気分をどの程度感じましたか？
</p>


<div id="questions"></div>
  <div id="errorMessage" role="alert" aria-live="assertive"></div>



<div id="bottom">

  <button type="button" onclick="recommend()">
    結果を見る
  </button>

</div>


<script>

// ========================================
// 簡易版 7項目
// ========================================

const questions = [

  {
    text: "不安を感じた",
    type: "tension"
  },

  {
    text: "気分が沈んでいた",
    type: "depression"
  },

  {
    text: "イライラしていた",
    type: "anger"
  },

  {
    text: "元気があった",
    type: "vigor"
  },

  {
    text: "疲れていた",
    type: "fatigue"
  },

  {
    text: "集中できなかった",
    type: "confusion"
  },

  {
    text: "人に親しみを感じた",
    type: "friendliness"
  }

];


// ========================================
// 共通選択肢
// ========================================

const options = [

  ["", "選択してください"],

  ["0", "まったくなかった"],

  ["1", "少しあった"],

  ["2", "まあまああった"],

  ["3", "かなりあった"],

  ["4", "非常に多くあった"]

];


// ========================================
// 質問を表示
// ========================================

const container =
  document.getElementById("questions");


questions.forEach(function(q, i) {

  const div =
    document.createElement("div");

  div.className =
    "question";


  const label =
    document.createElement("span");

  label.textContent =
    q.text;


  const select =
    document.createElement("select");

  select.id =
    "q" + i;


  options.forEach(function(item) {

    const option =
      document.createElement("option");

    option.value =
      item[0];

    option.textContent =
      item[1];

    // 初期表示専用。プルダウンで選べるのは5択のみ
    if (item[0] === "") {
      option.disabled = true;
      option.selected = true;
      option.hidden = true;
    }

    select.appendChild(option);

  });


  div.appendChild(label);

  div.appendChild(select);

  container.appendChild(div);

});


// ========================================
// 結果を計算
// ========================================

function recommend() {

      // 未回答があれば、最初の未回答項目へ誘導して結果画面には進まない
      const unanswered = [];
      questions.forEach(function(question, index) {
        const select = document.getElementById("q" + index);
        if (!select || select.value === "") {
          unanswered.push(index);
        }
      });

      document.querySelectorAll(".question.unanswered").forEach(function(el) {
        el.classList.remove("unanswered");
      });

      const errorMessage = document.getElementById("errorMessage");
      if (unanswered.length > 0) {
        unanswered.forEach(function(index) {
          const select = document.getElementById("q" + index);
          if (select && select.parentElement) {
            select.parentElement.classList.add("unanswered");
          }
        });
        errorMessage.textContent = "未回答の質問が " + unanswered.length + " 問あります。赤く表示された質問に回答してください。";
        errorMessage.style.display = "block";
        const first = document.getElementById("q" + unanswered[0]);
        if (first) {
          first.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(function() { first.focus({ preventScroll: true }); }, 350);
        }
        return;
      }
      errorMessage.style.display = "none";


  const score = {

    tension: 0,

    depression: 0,

    anger: 0,

    vigor: 0,

    fatigue: 0,

    confusion: 0,

    friendliness: 0

  };


  questions.forEach(function(q, i) {

    const value =
      document.getElementById(
        "q" + i
      ).value;


    // 未入力
    if (value === "") {

      score[q.type] = 0;

    }

    // 回答済み
    else {

      score[q.type] =
        (Number(value) - 2) / 2;

    }

  });


  localStorage.setItem(
    "poms_score",
    JSON.stringify(score)
  );


  location.href =
    "result_simple.html";

}

</script>

</body>
</html>
