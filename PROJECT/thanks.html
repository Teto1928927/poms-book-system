<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>回答完了</title>

<script id="dev-helper">
window.POMS_DEV =
  new URLSearchParams(location.search).get('dev') === '1';

window.withDev = function(url){
  return window.POMS_DEV
    ? url + (url.includes('?') ? '&' : '?') + 'dev=1'
    : url;
};

if(window.POMS_DEV){
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.createElement('div');
    b.className = 'dev-banner';
    b.textContent =
      '開発者モード：テスト回答は研究データ対象外です';

    document.body.prepend(b);
  });
}
</script>

</head>

<body>

<main class="survey-page">

  <section class="survey-card">

    <h1>ご協力ありがとうございました</h1>

    <p>
      回答データを送信しています
    </p>

    <div id="saveStatus">
      送信処理を開始しています
    </div>

    <br>

    <a
      class="survey-button"
      href="index.html"
      id="topLink">
      トップページへ戻る
    </a>

  </section>

</main>

<script>
(function () {

  function parse(key) {
    const value = localStorage.getItem(key);

    try {
      return JSON.parse(value);
    } catch (e) {
      return value;
    }
  }

  const participantId =
    localStorage.getItem("participant_id");

  console.log(
    "送信ID:",
    participantId
  );

  const rec = {
    participant_id: participantId,
    mode: localStorage.getItem("recommendation_mode"),
    reading_level: localStorage.getItem("poms_level"),
    poms_score: parse("poms_score"),
    recommended_books: parse("recommended_books") || [],
    stage1_evaluation: parse("stage1_evaluation"),
    reading_status: localStorage.getItem("reading_status"),
    stage2_evaluation: parse("stage2_evaluation"),
    developer: window.POMS_DEV,
    timestamp: new Date().toISOString()
  };

  localStorage.setItem(
    "research_record",
    JSON.stringify(rec)
  );

  const status =
    document.getElementById("saveStatus");

  if (status) {
    status.textContent =
      "回答データ送信中";
  }

  fetch(
    "https://script.google.com/macros/s/AKfycbw97tqf8xsDLsbuyMQAkRAsNMQDRmjWl8BIUoMUzwevbPyPw6qS84uxh2LskX2NwrSAjw/exec",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },
      body: JSON.stringify(rec)
    }
  )
  .then(function(response) {
    return response.text();
  })
  .then(function(data) {

    console.log(
      "送信成功",
      data
    );

    if (status) {
      status.textContent =
        "送信完了";
    }

  })
  .catch(function(error) {

    console.error(
      "送信失敗",
      error
    );

    if (status) {
      status.textContent =
        "送信エラーが発生しました";
    }

  });

  const topLink =
    document.getElementById("topLink");

  if (topLink) {
    topLink.href =
      withDev("index.html");
  }

})();
</script>

</body>
</html>
