<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>気分チェック 通常版</title>

  <link rel="stylesheet" href="style.css">


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px 12px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 4px 0;
    }

    .description {
      text-align: center;
      font-size: 13px;
      margin: 4px 0 8px;
    }


    /* =====================================
       質問一覧
       PCでは8列
       ===================================== */

    #questions {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }


    /* =====================================
       質問カード
       ===================================== */

    .question {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      background: #f5f5f5;

      padding: 5px;

      border-radius: 6px;

      min-height: 75px;
    }


    .question-label {
      text-align: center;
      font-size: 11px;
      line-height: 1.2;
      margin-bottom: 4px;
    }


    /* =====================================
       選択欄
       ===================================== */

    .question select {
      width: 100%;
      height: 28px;
      padding: 1px;
      font-size: 10px;
    }


    /* =====================================
       結果ボタン
       ===================================== */

    #bottom {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }


    button {
      width: 250px;

      padding: 8px;

      font-size: 16px;

      background: #4CAF50;

      color: white;

      border: none;

      border-radius: 8px;

      cursor: pointer;
    }


    /* =====================================
       小さいPC
       ===================================== */

    @media (max-width: 1200px) {

      #questions {
        grid-template-columns: repeat(5, 1fr);
      }

    }


    /* =====================================
       タブレット
       ===================================== */

    @media (max-width: 900px) {

      #questions {
        grid-template-columns: repeat(4, 1fr);
      }

    }


    /* =====================================
       スマートフォン
       ===================================== */

    @media (max-width: 767px) {

      #questions {
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
      }

      .question {
        min-height: 85px;
        padding: 7px;
      }

      .question-label {
        font-size: 12px;
      }

      .question select {
        height: 34px;
        font-size: 11px;
      }

      button {
        width: 100%;
        min-height: 45px;
      }

    }

  
/* 未回答項目の誘導 */
.question.unanswered {
  border: 2px solid #d32f2f;
  background: #fff1f1;
}
.question.unanswered select {
  border: 2px solid #d32f2f;
}
#errorMessage {
  display: none;
  color: #b71c1c;
  background: #ffebee;
  border: 1px solid #ef9a9a;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 12px auto;
  max-width: 720px;
  font-weight: bold;
  text-align: center;
}
</style>

</head>


<body>


  <h1>
    気分チェック 通常版
  </h1>


  <p class="description">
    今日を含めて過去1週間に、
    次の気分をどの程度感じましたか？
  </p>


  <div id="questions"></div>
  <div id="errorMessage" role="alert" aria-live="assertive"></div>



  <div id="bottom">

    <button
      type="button"
      id="resultButton"
    >
      結果を見る
    </button>

  </div>



  <script>

    // =====================================
    // 40問
    // =====================================

    const questions = [


      // -----------------------------------
      // 緊張・不安 6問
      // -----------------------------------

      {
        text: "落ち着かなかった",
        type: "tension"
      },

      {
        text: "不安を感じた",
        type: "tension"
      },

      {
        text: "緊張していた",
        type: "tension"
      },

      {
        text: "心配だった",
        type: "tension"
      },

      {
        text: "そわそわしていた",
        type: "tension"
      },

      {
        text: "神経が高ぶっていた",
        type: "tension"
      },


      // -----------------------------------
      // 抑うつ・落込み 6問
      // -----------------------------------

      {
        text: "気分が沈んでいた",
        type: "depression"
      },

      {
        text: "悲しかった",
        type: "depression"
      },

      {
        text: "やる気が出なかった",
        type: "depression"
      },

      {
        text: "絶望的に感じた",
        type: "depression"
      },

      {
        text: "自分に価値がないと感じた",
        type: "depression"
      },

      {
        text: "落ち込んでいた",
        type: "depression"
      },


      // -----------------------------------
      // 怒り・敵意 6問
      // -----------------------------------

      {
        text: "イライラしていた",
        type: "anger"
      },

      {
        text: "腹が立った",
        type: "anger"
      },

      {
        text: "怒りっぽかった",
        type: "anger"
      },

      {
        text: "不機嫌だった",
        type: "anger"
      },

      {
        text: "敵意を感じた",
        type: "anger"
      },

      {
        text: "短気だった",
        type: "anger"
      },


      // -----------------------------------
      // 活気・活力 6問
      // -----------------------------------

      {
        text: "元気があった",
        type: "vigor"
      },

      {
        text: "活力があった",
        type: "vigor"
      },

      {
        text: "生き生きしていた",
        type: "vigor"
      },

      {
        text: "調子が良かった",
        type: "vigor"
      },

      {
        text: "エネルギーがあった",
        type: "vigor"
      },

      {
        text: "やる気があった",
        type: "vigor"
      },


      // -----------------------------------
      // 疲労・無気力 6問
      // -----------------------------------

      {
        text: "疲れていた",
        type: "fatigue"
      },

      {
        text: "だるかった",
        type: "fatigue"
      },

      {
        text: "体が重かった",
        type: "fatigue"
      },

      {
        text: "眠かった",
        type: "fatigue"
      },

      {
        text: "消耗していた",
        type: "fatigue"
      },

      {
        text: "ぐったりしていた",
        type: "fatigue"
      },


      // -----------------------------------
      // 混乱・当惑 5問
      // -----------------------------------

      {
        text: "頭が混乱していた",
        type: "confusion"
      },

      {
        text: "集中できなかった",
        type: "confusion"
      },

      {
        text: "考えがまとまらなかった",
        type: "confusion"
      },

      {
        text: "ぼんやりしていた",
        type: "confusion"
      },

      {
        text: "判断しにくかった",
        type: "confusion"
      },


      // -----------------------------------
      // 友好 5問
      // -----------------------------------

      {
        text: "人に親しみを感じた",
        type: "friendliness"
      },

      {
        text: "人に対して好意的に感じた",
        type: "friendliness"
      },

      {
        text: "人と関わりたいと感じた",
        type: "friendliness"
      },

      {
        text: "人に温かい気持ちを感じた",
        type: "friendliness"
      },

      {
        text: "人とのつながりを感じた",
        type: "friendliness"
      }

    ];



    // =====================================
    // 選択肢
    // =====================================

    const options = [

      {
        value: "",
        text: "選択してください"
      },

      {
        value: "0",
        text: "まったくなかった"
      },

      {
        value: "1",
        text: "少しあった"
      },

      {
        value: "2",
        text: "まあまああった"
      },

      {
        value: "3",
        text: "かなりあった"
      },

      {
        value: "4",
        text: "非常に多くあった"
      }

    ];



    // =====================================
    // 質問を画面へ表示
    // =====================================

    function createQuestions() {

      const container =
        document.getElementById(
          "questions"
        );


      // 念のため初期化
      container.innerHTML = "";


      questions.forEach(
        function(question, index) {


          // -------------------------------
          // 質問カード
          // -------------------------------

          const questionDiv =
            document.createElement(
              "div"
            );


          questionDiv.className =
            "question";



          // -------------------------------
          // 質問文
          // -------------------------------

          const questionLabel =
            document.createElement(
              "div"
            );


          questionLabel.className =
            "question-label";


          questionLabel.textContent =

            (index + 1) +

            ". " +

            question.text;



          // -------------------------------
          // select
          // -------------------------------

          const select =
            document.createElement(
              "select"
            );


          select.id =
            "q" + index;


          select.name =
            "q" + index;



          // -------------------------------
          // option
          // -------------------------------

          options.forEach(
            function(optionData) {


              const option =
                document.createElement(
                  "option"
                );


              option.value =
                optionData.value;


              option.textContent =
                optionData.text;


              // 初期表示専用。プルダウンで選べるのは5択のみ
              if (optionData.value === "") {
                option.disabled = true;
                option.selected = true;
                option.hidden = true;
              }


              select.add(
                option
              );

            }
          );



          // -------------------------------
          // カードへ追加
          // -------------------------------

          questionDiv.appendChild(
            questionLabel
          );


          questionDiv.appendChild(
            select
          );



          // -------------------------------
          // 質問一覧へ追加
          // -------------------------------

          container.appendChild(
            questionDiv
          );

        }
      );

    }



    // =====================================
    // 診断結果を計算
    // =====================================

    function recommend() {

      // 未回答があれば、最初の未回答項目へ誘導して結果画面には進まない
      const unanswered = [];
      questions.forEach(function(question, index) {
        const select = document.getElementById("q" + index);
        if (!select || select.value === "") {
          unanswered.push(index);
        }
      });

      document.querySelectorAll(".question.unanswered").forEach(function(el) {
        el.classList.remove("unanswered");
      });

      const errorMessage = document.getElementById("errorMessage");
      if (unanswered.length > 0) {
        unanswered.forEach(function(index) {
          const select = document.getElementById("q" + index);
          if (select && select.parentElement) {
            select.parentElement.classList.add("unanswered");
          }
        });
        errorMessage.textContent = "未回答の質問が " + unanswered.length + " 問あります。赤く表示された質問に回答してください。";
        errorMessage.style.display = "block";
        const first = document.getElementById("q" + unanswered[0]);
        if (first) {
          first.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(function() { first.focus({ preventScroll: true }); }, 350);
        }
        return;
      }
      errorMessage.style.display = "none";



      // -----------------------------------
      // 合計
      // -----------------------------------

      const totals = {

        tension: 0,

        depression: 0,

        anger: 0,

        vigor: 0,

        fatigue: 0,

        confusion: 0,

        friendliness: 0

      };



      // -----------------------------------
      // 回答数
      // -----------------------------------

      const counts = {

        tension: 0,

        depression: 0,

        anger: 0,

        vigor: 0,

        fatigue: 0,

        confusion: 0,

        friendliness: 0

      };



      // ===================================
      // 回答を取得
      // ===================================

      questions.forEach(
        function(question, index) {


          const select =
            document.getElementById(
              "q" + index
            );


          if (!select) {

            return;

          }


          const value =
            select.value;



          // -------------------------------
          // 未入力
          // -------------------------------

          if (value === "") {

            return;

          }



          // -------------------------------
          // 回答あり
          // -------------------------------

          totals[question.type] +=
            Number(value);


          counts[question.type] +=
            1;

        }
      );



      // ===================================
      // 最終スコア
      // ===================================

      const score = {

        tension: 0,

        depression: 0,

        anger: 0,

        vigor: 0,

        fatigue: 0,

        confusion: 0,

        friendliness: 0

      };



      // ===================================
      // 各尺度を -1 ～ +1 へ変換
      // ===================================

      Object.keys(score)
      .forEach(
        function(key) {


          // -------------------------------
          // 回答あり
          // -------------------------------

          if (
            counts[key] > 0
          ) {


            const average =

              totals[key] /

              counts[key];



            // 0 → -1.00
            // 1 → -0.50
            // 2 →  0.00
            // 3 → +0.50
            // 4 → +1.00

            score[key] =

              (average - 2) /

              2;

          }


          // -------------------------------
          // 全部未回答
          // -------------------------------

          else {

            score[key] = 0;

          }

        }
      );



      // ===================================
      // 保存
      // ===================================

      localStorage.setItem(

        "poms_score",

        JSON.stringify(
          score
        )

      );



      // ===================================
      // 結果ページへ
      // ===================================

      window.location.href =
        "result.html";

    }



    // =====================================
    // 結果ボタン
    // =====================================

    document
      .getElementById(
        "resultButton"
      )
      .addEventListener(
        "click",
        recommend
      );



    // =====================================
    // ページ読み込み後に質問を生成
    // =====================================

    createQuestions();

  </script>


</body>

</html>
